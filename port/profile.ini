# The Last of Us Remastered (CUSA00552 1.11): game profile, layer 2 (src/runtime_profile.c).
# Core defaults < this file < launcher/player < environment (TLOU_X is aliased to TLG_X first).
tsc = auto              # ~700 raw rdtsc in the eboot: expected to pick host
readbacks = 2           # start precise, like every new port (AGENTS.md)
eager_readback = 0       # on: the EOP frame marker goes stale and the first gameplay frame never completes (HALT in WaitOnContextDone)
write_merge = 0          # off together with eager readback (same hang)
gc_budget_mb = 3500
block1d = 0
pipeline_binaries = 0   # VK_KHR_pipeline_binary crashes on the NVIDIA 595 driver

[env]
# sceKernelGetDirectMemorySize must be exactly 0x120000000 (base PS4): with any other size and
# IsNeoMode 0 the engine assumes a devkit and adds a "Game Debug" arena (ASSERTION ret == 0 in
# AllocateMemory, memory-area-ps4.cpp:102).
DMEM_MB = 4608
